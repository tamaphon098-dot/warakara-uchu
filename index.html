<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#160d05"><meta name="description" content="わら1本から宇宙を目指す、物々交換ローグライク。">
<link rel="icon" href="img/i_wara.webp">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>わらから宇宙へ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<script src="i18n.js"></script>
<style>
/* Layout: one phone-width column. A painted era scene sits behind everything; HUD on top, wooden/parchment trade board below, tab bar fixed at the bottom. Single committed look (warm market at dusk), same in light and dark. */
:root{
  --ink:#2a1a0e;
  --ink-soft:#6b4a2c;
  --paper:#f5e6c4;
  --paper-2:#e9d2a0;
  --paper-3:#fbf3df;
  --wood:#5b3a21;
  --wood-dark:#33200f;
  --gold:#d6a03c;
  --gold-hi:#ffe08a;
  --crimson:#a3221c;
  --crimson-hi:#d8433a;
  --navy:#1d2547;
  --navy-hi:#34407a;
  --jade:#4fdc5a;
  --jade-dark:#1e6b2a;
  --danger:#e0463b;
  --white:#fffaf0;
  --shadow:rgba(20,10,0,.45);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;padding-top:max(var(--sat,0px),env(safe-area-inset-top,0px));padding-bottom:max(var(--sab,0px),env(safe-area-inset-bottom,0px))}
html,body{height:100%}
body{margin:0;background:var(--wood-dark);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.emo{font-family:var(--emoji);line-height:1;display:inline-block}

#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#7fb5e3}
#bg svg{position:absolute;left:50%;top:0;transform:translateX(-50%);width:max(100%,480px);height:100%}
#tint{position:absolute;inset:0;pointer-events:none;transition:background .8s}
.bgimg{position:absolute;left:50%;top:0;transform:translateX(-50%);width:max(100%,480px);height:100%;background-size:cover;background-position:center top}
.icimg{width:1em;height:1em;object-fit:contain;display:inline-block;vertical-align:middle}
.card .ic .icimg{width:92px;height:92px}
.ric .icimg{width:40px;height:40px}
.dex .icimg{width:34px;height:34px}
.need .icimg{width:16px;height:16px}
.m-art{position:absolute;right:-18px;bottom:-40px;width:262px;height:262px;pointer-events:none;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.m-art.mystery{filter:drop-shadow(0 0 16px #a78bff) drop-shadow(0 0 4px #a78bff)}
.m-plate.over{position:absolute;right:0;bottom:4px;z-index:1}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx.rain{background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(220,235,255,.35) 9px 10px);background-size:40px 60px;animation:rain .35s linear infinite}
#fx.storm{background:repeating-linear-gradient(110deg,transparent 0 5px,rgba(220,235,255,.45) 5px 6px);background-size:30px 50px;animation:rain .22s linear infinite}
#fx.snow{background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#fff 0 1.5px,transparent 2.5px);background-size:46px 46px,29px 29px;animation:snow 4s linear infinite}
@keyframes rain{to{background-position:-20px 60px}}
@keyframes snow{to{background-position:20px 46px,-12px 29px}}
.petal{position:absolute;top:-20px;width:10px;height:7px;background:#f7b9cd;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,105vh) rotate(540deg)}}

#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.hud{padding:8px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));display:grid;gap:6px;background:linear-gradient(rgba(20,12,4,.55),rgba(20,12,4,0))}
.hud-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{margin:0;font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.logo .l1{background:linear-gradient(#fff6c8,#f1c15a 55%,#b97a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2208) drop-shadow(0 0 1px #3a2208)}
.logo .l2{background:linear-gradient(#ffffff,#9fd2ff 50%,#3b6fd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0d1640) drop-shadow(0 0 1px #0d1640);font-size:31px}
.goal{border:2px solid var(--gold);border-radius:8px;padding:3px 10px;background:linear-gradient(135deg,#141a3d,#2c2363 60%,#4a2b6e);color:var(--white);text-align:center;box-shadow:0 2px 6px var(--shadow)}
.goal small{display:block;font-size:10px;color:var(--gold-hi);letter-spacing:.1em}
.goal b{font-family:var(--display);font-size:15px;letter-spacing:.08em}
.hud-row2{display:flex;gap:6px}
.chapter{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink);background:linear-gradient(var(--paper-3),var(--paper-2));border:2px solid var(--gold);border-radius:6px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daybox{flex:0 0 auto;font-weight:700;font-size:12px;color:var(--white);background:rgba(18,22,44,.85);border:2px solid var(--gold);border-radius:6px;padding:4px 10px;white-space:nowrap;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.daybox small{color:var(--gold-hi);font-size:10px}
.hud-row3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:5px;align-items:center}
.chip{min-width:0;background:rgba(24,16,8,.82);border:1.5px solid var(--gold);border-radius:999px;padding:3px 9px;color:var(--white);display:flex;flex-direction:column;line-height:1.15}
.chip span{font-size:9px;color:var(--gold-hi);letter-spacing:.06em}
.chip b{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b.up{color:var(--jade)}
.gear{width:32px;height:32px;border-radius:50%;background:radial-gradient(#4a3a20,#1e1408);border:2px solid var(--gold);color:var(--gold-hi);font-size:17px;display:grid;place-items:center}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.view{display:grid;gap:10px}

/* stage */
.stage{position:relative;height:212px}
.wx{position:absolute;left:0;top:4px;z-index:1;max-width:70%;background:rgba(255,248,230,.92);border:1.5px solid var(--gold);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;line-height:1.35;box-shadow:0 2px 6px var(--shadow)}
.wx b{font-family:var(--display);font-size:13px}
.wx .tmr{display:block;font-weight:500;color:var(--ink-soft)}
.merchant{position:absolute;right:4px;bottom:0;width:150px;display:grid;justify-items:center}
.m-face{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:80px;background:radial-gradient(circle at 50% 40%,rgba(255,240,200,.95),rgba(255,214,140,.55) 55%,rgba(255,200,120,0) 72%);animation:bob 3s ease-in-out infinite}
.m-face.mystery{background:radial-gradient(circle,rgba(130,90,255,.6),rgba(20,0,60,0) 70%);filter:drop-shadow(0 0 10px #a78bff)}
@keyframes bob{50%{transform:translateY(-5px)}}
.m-plate{margin-top:-6px;background:linear-gradient(#3c2814,#24170a);border:1.5px solid var(--gold);border-radius:8px;color:var(--white);padding:3px 8px;text-align:center;font-size:11px;line-height:1.3;box-shadow:0 2px 6px var(--shadow);max-width:150px}
.m-plate b{font-family:var(--display);font-size:13px;display:block;white-space:nowrap}
.m-meta{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--gold-hi)}
.bubble{position:absolute;left:0;bottom:22px;right:150px;z-index:1;background:var(--paper-3);border:2px solid #c9a45e;border-radius:18px;padding:9px 12px;font-family:var(--display);font-weight:800;font-size:14px;line-height:1.45;box-shadow:0 3px 8px var(--shadow)}
.bubble::after{content:"";position:absolute;right:-12px;bottom:18px;border:8px solid transparent;border-left:12px solid var(--paper-3)}
.side-btns{position:absolute;left:0;top:58px;display:flex;gap:6px;z-index:1}
.pill{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--white);background:linear-gradient(#2a1d4e,#140c2c);border:1.5px solid #a78bff;box-shadow:0 0 10px rgba(167,139,255,.5)}
.pill.abu{background:linear-gradient(#5b7a1e,#2f4510);border-color:#c9f06a;box-shadow:0 0 10px rgba(201,240,106,.6);animation:pulse 1.4s ease-in-out infinite}
.pill.back{background:linear-gradient(#5b3a21,#33200f);border-color:var(--gold);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.06)}}

/* board */
.board{position:relative;z-index:2;background:linear-gradient(var(--paper-3),var(--paper) 40%,var(--paper-2));border:5px solid var(--wood);outline:2px solid var(--gold);outline-offset:-9px;border-radius:14px;padding:16px 14px 14px;display:grid;gap:10px;box-shadow:0 6px 18px var(--shadow)}
.pair{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:4px}
.card{position:relative;min-width:0;background:radial-gradient(circle at 50% 42%,#fffbe8,#f6e4b8 60%,#ead09a);border:2px solid #b8894a;border-radius:10px;padding:22px 6px 8px;text-align:center;display:grid;justify-items:center;gap:2px;min-height:150px}
button.card{width:100%}
.card .rib{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:900;color:var(--white);padding:3px 10px;border-radius:4px;border:1.5px solid var(--gold);letter-spacing:.04em}
.mine .rib{background:linear-gradient(#34407a,#1d2547)}
.theirs .rib{background:linear-gradient(#b8352c,#7d1712)}
.card .ic{font-size:58px;height:92px;display:grid;place-items:center;filter:drop-shadow(0 3px 3px rgba(80,40,0,.3))}
.card .nm{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}
.card .vl{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.card .tag{font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;background:#ffdf8a;color:#7a3b00;border:1px solid #d49a2a}
.card .tag.hot{background:#ff7a3a;color:#fff;border-color:#b84010}
.card .tag.fake{background:#2a1a0e;color:#ff8b7d;border-color:#ff8b7d}
.card .swap{font-size:10px;color:var(--navy-hi);font-weight:900}
.card .add{font-size:11px;font-weight:900;color:#0f5f22}
.arrow{font-size:26px;color:#b07a22;text-align:center;filter:drop-shadow(0 2px 0 #6b4a12)}
.empty-bag{padding:18px;text-align:center;font-weight:700;line-height:1.7}
.rate{display:flex;align-items:center;gap:8px;background:linear-gradient(#2e2a20,#16130c);border:2px solid #8a6a2a;border-radius:10px;padding:6px 8px 6px 12px;position:relative;overflow:hidden;min-height:56px}
.rate .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(40,140,50,.55),rgba(80,220,90,.35));transition:width .5s}
.rate .fill.low{background:linear-gradient(90deg,rgba(170,50,40,.6),rgba(230,90,60,.35))}
.rate .lbl{position:relative;color:var(--white);font-weight:900;font-size:12px;line-height:1.2;flex:0 0 auto}
.rate .lbl small{display:block;color:var(--gold-hi);font-size:9px;font-weight:700}
.rate .pct{position:relative;flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:800;color:#c9ffb8;text-shadow:0 0 12px rgba(80,255,90,.75),0 2px 0 #0b3d12;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;line-height:1.1}
.rate .pct.low{color:#ffc7b8;text-shadow:0 0 12px rgba(255,90,60,.7),0 2px 0 #4a0a05}
.rate .pct.absurd{animation:wob 1.6s ease-in-out infinite}
.rate.wide{flex-wrap:wrap;justify-content:space-between}
.rate.wide .pct{order:3;flex:1 0 100%;letter-spacing:-.02em}
.rate .pct small{display:block;font-family:var(--ui);font-size:10px;font-weight:700;color:var(--gold-hi);text-shadow:none;white-space:normal}
@keyframes wob{25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
.mini{position:relative;flex:0 0 auto;background:linear-gradient(var(--paper-3),var(--paper-2));border:1.5px solid #8a6a2a;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:900;color:var(--ink)}
.btn-main{position:relative;width:100%;height:62px;border-radius:12px;background:linear-gradient(#e2564a,#a3221c 55%,#7a140f);border:3px solid var(--gold);box-shadow:0 4px 0 #4a0c08,0 6px 14px var(--shadow),inset 0 2px 0 rgba(255,255,255,.35);color:var(--white);font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.12em;text-shadow:0 2px 0 #5a0e09;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0c08,inset 0 2px 0 rgba(255,255,255,.35)}
.btn-main[disabled]{filter:grayscale(.8) brightness(.8);cursor:not-allowed}
.btn-main.cosmic{background:linear-gradient(#6b4ae0,#2b1580 55%,#120842);box-shadow:0 4px 0 #0a0428,0 0 22px rgba(140,110,255,.7),inset 0 2px 0 rgba(255,255,255,.35)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-width:0;border-radius:10px;background:linear-gradient(#fff8e6,#efd9a8);border:2px solid #b8894a;box-shadow:0 3px 0 #8a6326;padding:7px 6px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;font-weight:900;font-size:15px;color:var(--ink);line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6326}
.btn small{display:block;font-size:10px;font-weight:700;color:var(--ink-soft)}
.btn .emo{font-size:22px}
.btn[disabled]{background:linear-gradient(#e8e2d6,#cfc7b8);border-color:#a39a88;box-shadow:0 3px 0 #857c6c;color:#7a7266;cursor:not-allowed}
.btn.confirm{background:linear-gradient(#ffd7c9,#f39b84);border-color:#b8352c}
.btn.gold{background:linear-gradient(#fff1b8,#f0c45a);border-color:#a8781c}
.btn.dark{background:linear-gradient(#3b2d5e,#1d1438);border-color:#a78bff;color:var(--white);box-shadow:0 3px 0 #0e0820}
.btn.dark small{color:#cdbfff}
.btn.sm{font-size:12px;padding:5px 8px;gap:4px;border-radius:8px}

/* panels for other tabs */
.panel{background:linear-gradient(var(--paper-3),var(--paper));border:4px solid var(--wood);outline:1.5px solid var(--gold);outline-offset:-7px;border-radius:12px;padding:14px 12px;display:grid;gap:10px;box-shadow:0 5px 14px var(--shadow)}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.panel h2 small{font-family:var(--ui);font-size:11px;color:var(--ink-soft);font-weight:700;margin-left:auto}
.panel p.note{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.6}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:rgba(255,255,255,.55);border:1.5px solid #d4b47a;border-radius:9px;padding:7px 8px}
.row .ric{font-size:30px;text-align:center}
.row .rt{min-width:0;line-height:1.35}
.row .rt b{font-weight:900;font-size:14px;display:block}
.row .rt span{font-size:11px;color:var(--ink-soft);display:block}
.row .ract{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.row.sel{border-color:var(--navy-hi);box-shadow:0 0 0 2px rgba(52,64,122,.35)}
.row.locked{opacity:.55}
.need{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.need i{font-style:normal;font-size:11px;padding:1px 5px;border-radius:4px;background:#efe0bc;border:1px solid #cbb07a;font-variant-numeric:tabular-nums}
.need i.ok{background:#d9f2cf;border-color:#7fb86a}
.need i.no{background:#f7d6cf;border-color:#d38a7a}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mk div{background:rgba(255,255,255,.6);border:1px solid #d4b47a;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:4px;font-variant-numeric:tabular-nums}
.mk .u{color:#1a8a2e}.mk .d{color:#c0392b}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.dex div{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid #d4b47a;border-radius:6px;font-size:22px}
.dex div.no{color:#b9a27a;font-size:15px;font-weight:900;font-family:var(--display)}
.shopcard{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:linear-gradient(135deg,#2c1d0e,#4a2f17);color:var(--white);border:2px solid var(--gold);border-radius:10px;padding:10px}
.shopcard .si{font-size:64px;text-align:center}
.shopcard b{font-family:var(--display);font-size:18px;display:block}
.shopcard span{font-size:12px;color:var(--gold-hi);display:block;line-height:1.5}
.locked-over{text-align:center;padding:30px 10px;font-weight:700;line-height:1.8}
.locked-over .emo{font-size:46px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(#2a1a0c,#160d05);border-top:2px solid var(--gold)}
.tab{position:relative;border-radius:10px;padding:5px 0 4px;display:grid;justify-items:center;gap:1px;color:#e8d6b0;font-family:var(--display);font-weight:800;font-size:14px;background:linear-gradient(#3a2a18,#22160a);border:1.5px solid #7a5a2a}
.tab .emo{font-size:24px}
.tab.on{background:linear-gradient(#5b4bb5,#2a2070);border-color:var(--gold-hi);color:var(--white);box-shadow:0 0 12px rgba(150,130,255,.6)}
.tab .badge{position:absolute;top:-6px;right:6px;width:20px;height:20px;border-radius:50%;background:radial-gradient(#ff6a5a,#c0170c);border:2px solid #fff;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;font-family:var(--ui)}
.tab .lock{position:absolute;top:2px;right:6px;font-size:12px}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,6,2,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal.center{align-items:center}
.sheet{width:100%;max-width:456px;max-height:88%;overflow-y:auto;background:linear-gradient(var(--paper-3),var(--paper));border:4px solid var(--wood);outline:1.5px solid var(--gold);outline-offset:-8px;border-radius:14px;padding:18px 14px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px)}}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;text-align:center;text-wrap:balance}
.sheet p{margin:0;line-height:1.7;font-size:14px}
.sheet .center{text-align:center}
.sheet .btns{display:grid;gap:8px}
.sheet .btns.two{grid-template-columns:1fr 1fr}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;font-weight:900;text-align:right}
.kv .tot{border-top:1.5px solid #c9a45e;padding-top:4px;font-size:15px}
.duel{display:flex;align-items:center;justify-content:center;gap:14px;font-size:60px;padding:6px 0}
.duel .vs{font-size:34px;animation:shake .25s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.result{font-family:var(--display);font-weight:800;font-size:40px;text-align:center;letter-spacing:.1em}
.result.ok{color:#1d8a2c;text-shadow:0 0 14px rgba(255,230,120,.9)}
.result.ng{color:#a3221c}
.bigp{font-family:var(--display);font-weight:800;text-align:center;color:#1e6b2a;word-break:break-all;line-height:1.2}
.negomoves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.say{background:var(--white);border:2px solid #c9a45e;border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:800;font-size:15px;text-align:center}
.hint{font-size:12px;font-weight:700;color:#3d2c88;background:#e6e0ff;border:1px solid #a99ae8;border-radius:6px;padding:5px 8px;text-align:center}
.pat{letter-spacing:2px;color:#c0392b}
.adbox{display:grid;place-items:center;gap:8px;padding:30px 10px;text-align:center;font-weight:700}
.adbox .emo{font-size:48px}
.cosmos-bg{background:radial-gradient(circle at 30% 20%,#4b2a8a,#120830 60%,#05020f) !important;color:#efe8ff}
.cosmos-bg h3{color:#fff}

#toasts{position:fixed;left:50%;top:calc(10px + max(var(--sat,0px),env(safe-area-inset-top,0px)));transform:translateX(-50%);z-index:30;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:rgba(24,16,8,.92);color:var(--white);border:1.5px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.good{border-color:var(--jade)}
.toast.bad{border-color:var(--danger)}
@keyframes tin{from{transform:translateY(-12px)}}
.frag{position:fixed;z-index:25;font-size:26px;pointer-events:none;font-family:var(--emoji);animation:frag .9s ease-out forwards}
@keyframes frag{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.spark{position:fixed;z-index:25;pointer-events:none;width:8px;height:8px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px var(--gold-hi);animation:frag 1s ease-out forwards}
.shatter{animation:shat .35s ease-in-out}
@keyframes shat{20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tint-gold{filter:sepia(1) saturate(6) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px #ffd24a)}
.tint-legend{animation:legend 2.4s linear infinite}
@keyframes legend{from{filter:hue-rotate(0) saturate(3) drop-shadow(0 0 8px #fff)}to{filter:hue-rotate(360deg) saturate(3) drop-shadow(0 0 8px #fff)}}
.tint-bundle{text-shadow:6px 2px 0 rgba(160,120,40,.6),-6px 3px 0 rgba(160,120,40,.6)}
/* --- v3: tabs, visitors, rarity, effects --- */
.tabs{grid-template-columns:repeat(5,1fr);gap:4px}
.uprow{grid-template-columns:40px 1fr}
.uprow .upbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.uprow .upbtns .btn{font-size:11px;padding:6px 4px;justify-content:center}
.lvbar{height:5px;background:#e3cfa3;border-radius:3px;overflow:hidden;margin:3px 0}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#d6a03c,#ffe08a)}
.tab{font-size:12px}
.tab .emo{font-size:22px}
.small{font-size:11px;color:var(--ink-soft)}
.pill.quest{background:linear-gradient(#7a4a12,#4a2a06);border-color:var(--gold-hi);box-shadow:0 0 10px rgba(255,200,90,.5)}
.pill.omi{background:linear-gradient(#b8352c,#7d1712);border-color:#ffd0c0;box-shadow:none}
.side-btns{flex-wrap:nowrap;max-width:none;right:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.side-btns::-webkit-scrollbar{display:none}
.side-btns .pill{white-space:nowrap;flex:0 0 auto}
.m-art.enter{animation:enter .5s cubic-bezier(.2,.8,.3,1.2),bob 3.2s ease-in-out .5s infinite}
@keyframes enter{from{transform:translateX(90px)}}

.card.r1{border-color:#4a8fd8;box-shadow:0 0 0 2px rgba(74,143,216,.3),0 0 14px rgba(74,143,216,.35)}
.card.r2{border-color:#9b5be0;box-shadow:0 0 0 2px rgba(155,91,224,.35),0 0 18px rgba(155,91,224,.45)}
.card.r3{border-color:#e0a628;box-shadow:0 0 0 2px rgba(255,210,80,.5),0 0 22px rgba(255,190,60,.6)}
.card.r2,.card.r3{overflow:hidden}
.card.r2::after,.card.r3::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.card.r3::after{background:linear-gradient(105deg,transparent 38%,rgba(255,240,170,.8) 50%,transparent 62%)}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.board.visitor{gap:10px}
.vh .icimg{width:40px;height:40px}
.panel h2 .icimg{width:34px;height:34px}
.vh{margin:0;font-family:var(--display);font-weight:800;font-size:22px;text-align:center;display:flex;justify-content:center;gap:8px;align-items:center}
.board .note{margin:0;font-size:12px;line-height:1.6;color:var(--ink-soft)}
.stakes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chipbtn{border:2px solid #b8894a;border-radius:8px;background:#fff8e6;padding:7px 6px;font-size:12px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipbtn.on{background:linear-gradient(#34407a,#1d2547);color:#fff;border-color:var(--gold-hi)}
.chipbtn[disabled]{opacity:.45}
.chohan{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main.cho{background:linear-gradient(#e2564a,#a3221c 55%,#7a140f);font-size:36px}
.btn-main.han{background:linear-gradient(#3d3d3d,#151515 60%,#000);font-size:36px;box-shadow:0 4px 0 #000,0 6px 14px var(--shadow),inset 0 2px 0 rgba(255,255,255,.25)}
.qcard{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:#fffaf0;border:2px dashed #b8894a;border-radius:10px;padding:10px;font-size:14px;line-height:1.5}
.qic{font-size:56px;text-align:center}
.qic .icimg{width:68px;height:68px}
.qrew{font-weight:900;color:#1a6b2a}
.dice{display:flex;justify-content:center;gap:18px;padding:12px 0}
.die{width:64px;height:64px;background:linear-gradient(#fff,#e8e2d6);border-radius:12px;box-shadow:0 4px 0 #b9ae98,0 6px 12px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px}
.die i{display:block;border-radius:50%}
.die i.p{background:#1c1c1c}
.die.one i.p{background:#c0170c;transform:scale(1.35)}
.sheet.dark-bg{background:radial-gradient(circle at 50% 30%,#4a3420,#1a1008);color:#f5e6c4}
.sheet.dark-bg .say{color:var(--ink)}
.omikuji{display:flex;justify-content:center;padding:8px 0}
.omi-paper{writing-mode:vertical-rl;background:linear-gradient(90deg,#fffdf6,#f6edd8);border:1px solid #d9c9a3;box-shadow:0 6px 14px rgba(0,0,0,.25);padding:16px 14px;min-height:220px;display:flex;align-items:center;gap:14px;font-family:var(--display);animation:unroll .6s ease-out}
.omi-paper small{color:#a3221c;font-size:14px;letter-spacing:.3em}
.omi-paper b{font-size:52px;color:#a3221c;letter-spacing:.1em}
.omi-paper span{font-size:14px;line-height:1.7}
@keyframes unroll{from{transform:scaleY(.3)}}
.sellhead{display:flex;align-items:center;gap:10px}
.sellhead img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;background:radial-gradient(#fff3d0,#e9c98a);border:2px solid var(--gold)}
.sellhead b{font-family:var(--display);font-size:17px;display:block}
.sellitem{display:flex;align-items:center;gap:12px;background:#fffaf0;border:1.5px solid #d4b47a;border-radius:10px;padding:8px 12px}
.sellitem>.emo{font-size:60px}
.sellitem .icimg{width:72px;height:72px}
.mapcard{position:relative;border-radius:12px;overflow:hidden;min-height:112px;background-size:cover;background-position:center 30%;border:2px solid var(--gold);box-shadow:0 3px 8px var(--shadow)}
.mapcard .mc-in{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,12,4,.85),rgba(20,12,4,.35));color:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center;align-items:flex-start}
.mapcard b{font-family:var(--display);font-size:17px}
.mapcard span{font-size:11px;line-height:1.45}
.mapcard .small{color:var(--gold-hi)}
.mapcard.locked{filter:grayscale(.85) brightness(.75)}
.mapcard.here{border-color:#7fe08a;box-shadow:0 0 0 2px #7fe08a,0 3px 8px var(--shadow)}
.cutin{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;background:rgba(10,4,0,.55);animation:ciin .25s ease-out}
.cutin .ci-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;animation:cizoom 2.1s ease-out}
.cutin .ci-lines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,240,180,.0) 0 6deg,rgba(255,240,180,.22) 6deg 8deg);animation:spin 6s linear infinite}
.cutin .ci-img{position:absolute;right:-10px;bottom:22%;width:min(70vw,340px);filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));animation:cislide .45s cubic-bezier(.2,.8,.3,1.2)}
.cutin .ci-band{position:relative;width:100%;background:linear-gradient(90deg,transparent,rgba(120,10,6,.92) 15%,rgba(160,20,10,.95) 50%,rgba(120,10,6,.92) 85%,transparent);border-top:3px solid var(--gold-hi);border-bottom:3px solid var(--gold-hi);padding:14px 16px;text-align:center;color:#fff;animation:ciband .4s cubic-bezier(.2,.8,.3,1.3)}
.cutin .ci-band b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,46px);letter-spacing:.12em;text-shadow:0 3px 0 #3a0602,0 0 18px rgba(255,220,120,.8)}
.cutin .ci-band span{font-size:14px;font-weight:700;color:var(--gold-hi)}
@keyframes ciin{from{opacity:0}}
@keyframes cizoom{from{transform:scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cislide{from{transform:translateX(110%)}}
@keyframes ciband{from{transform:scaleX(.3)}}
#app.shake{animation:appshake .4s}
@keyframes appshake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.flash{position:fixed;inset:0;z-index:35;pointer-events:none;background:radial-gradient(circle,rgba(255,60,40,0),rgba(200,20,10,.45));animation:flash .45s ease-out forwards}
@keyframes flash{to{opacity:0}}
.dayttl{font-size:28px!important;letter-spacing:.15em;animation:ciband .5s cubic-bezier(.2,.8,.3,1.3)}
.dayic{animation:pop .6s cubic-bezier(.2,.8,.3,1.5)}
@keyframes pop{from{transform:scale(.55) rotate(-10deg)}}
#hMoney.up{color:var(--jade)}
/* --- opening story, rules, guide --- */
.story{position:fixed;inset:0;z-index:50;background:#0b0603;overflow:hidden;cursor:pointer;color:#fff}
.st-bg{position:absolute;inset:-4%;background-size:cover;background-position:center 30%}
.st-bg.kb{animation:kenburns 9s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.12) translateY(2%)}to{transform:scale(1)}}
.st-fx{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 40%,rgba(10,5,0,.75))}
.st-fx.night{background:linear-gradient(rgba(10,15,50,.65),rgba(5,5,20,.85))}
.st-fx.fire{background:radial-gradient(circle at 50% 70%,rgba(255,90,20,.55),rgba(60,0,0,.75));animation:flicker 1.3s ease-in-out infinite}
.st-fx.dusk{background:linear-gradient(rgba(255,140,60,.25),rgba(40,10,40,.6))}
@keyframes flicker{50%{opacity:.75}}
.st-chr{position:absolute;right:-6%;bottom:22%;width:min(78vw,420px);filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.st-chr.in{animation:enter .6s cubic-bezier(.2,.8,.3,1.2)}
.st-item{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:min(46vw,220px);filter:drop-shadow(0 0 30px rgba(255,220,120,.9));animation:float 3s ease-in-out infinite}
.st-item .icimg{width:1em;height:1em}
@keyframes float{50%{transform:translate(-50%,-56%)}}
.st-title{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(38px,12vw,64px);background:linear-gradient(#fff6c8,#f1c15a 55%,#b97a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2208);animation:pop .9s cubic-bezier(.2,.8,.3,1.4)}
.st-title span{background:linear-gradient(#fff,#9fd2ff 50%,#3b6fd6);-webkit-background-clip:text;background-clip:text}
.st-box{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(16px + max(var(--sab,0px),env(safe-area-inset-bottom,0px)));min-height:132px;background:linear-gradient(rgba(30,18,8,.92),rgba(18,10,4,.95));border:2px solid var(--gold);border-radius:12px;padding:18px 16px 26px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.st-name{position:absolute;top:-14px;left:14px;background:linear-gradient(#34407a,#1d2547);border:1.5px solid var(--gold);border-radius:6px;padding:2px 12px;font-family:var(--display);font-size:15px}
.st-text{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(15px,4.4vw,19px);line-height:1.8;color:#fff8e6}
.st-next{position:absolute;right:14px;bottom:6px;color:var(--gold-hi);animation:bob 1s ease-in-out infinite}
.st-skip{position:absolute;top:calc(12px + max(var(--sat,0px),env(safe-area-inset-top,0px)));right:max(12px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
.rules{display:grid;gap:8px;text-align:center}
.rl-img{height:150px;display:grid;place-items:center;background:radial-gradient(circle,#fff3d0,rgba(255,243,208,0) 70%)}
.rl-img img{max-height:150px;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.rl-step{font-size:11px;font-weight:900;color:var(--ink-soft);letter-spacing:.1em}
.rules p{text-align:left;font-size:14px;line-height:1.8}
.rl-dots{display:flex;justify-content:center;gap:6px}
.rl-dots i{width:8px;height:8px;border-radius:50%;background:#d8c39a}
.rl-dots i.on{background:var(--crimson);transform:scale(1.25)}
.linkbtn{justify-self:center;font-size:12px;color:var(--ink-soft);text-decoration:underline;padding:4px}
.pill.chest{background:linear-gradient(#8a5a10,#4a2a06);border-color:var(--gold-hi);box-shadow:0 0 12px rgba(255,210,90,.8);animation:pulse 1.2s ease-in-out infinite}
.chestic{font-size:110px}
.chestic .icimg{width:130px;height:130px;filter:drop-shadow(0 0 18px rgba(255,220,120,.9))}
.lineup{display:flex;gap:6px;position:relative;z-index:3;margin-top:-6px}
.lu{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:4px;padding:4px 6px;border-radius:10px;background:linear-gradient(rgba(40,26,12,.92),rgba(20,12,4,.95));border:2px solid #6b4a20;color:#fff}
.lu.on{border-color:var(--gold-hi);box-shadow:0 0 12px rgba(255,224,138,.7);background:linear-gradient(#3a2a70,#1d1440)}
.lu.no{opacity:.55}
.lu-face{grid-row:1/3;width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;background:radial-gradient(#fff3d0,#c9a45e);font-size:26px;display:grid;place-items:center}
.lu-off{font-size:18px;justify-self:start}.lu-off .icimg{width:22px;height:22px}
.lu b{font-size:12px;font-variant-numeric:tabular-nums;justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.btn.auto{grid-column:1/-1;min-height:40px;background:linear-gradient(#e6f0ff,#b9cdf2);border-color:#4a6aa8;box-shadow:0 3px 0 #2e4a80}
.pill.perk{background:linear-gradient(#1f6b4a,#0e3a26);border-color:#9ff0c8;box-shadow:none}
.perks{display:grid;gap:8px}
.perkcard{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:linear-gradient(#fffaf0,#f1dfb3);border:2px solid #b8894a;box-shadow:0 3px 0 #8a6326}
.perkcard .emo{grid-row:1/3;font-size:34px;align-self:center}
.perkcard b{font-family:var(--display);font-size:17px}
.perkcard span:last-child{font-size:12px;color:var(--ink-soft);line-height:1.5}
.perkcard:active{transform:translateY(2px)}
.autolog{display:grid;gap:4px;max-height:240px;overflow:auto;font-size:13px;background:#fffaf0;border:1px solid #d4b47a;border-radius:8px;padding:8px}
.ach{display:grid;gap:5px}
.ach div{display:grid;grid-template-columns:26px 1fr;column-gap:6px;align-items:center;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.5);border:1px solid #d4b47a;opacity:.75}
.ach div.ok{opacity:1;background:#fff3c4;border-color:#d6a03c}
.ach .emo{grid-row:1/3}
.ach b{font-size:13px}.ach span:last-child{font-size:11px;color:var(--ink-soft)}
.pill.kaiba{background:linear-gradient(#5a1010,#2a0606);border-color:#e0a628;box-shadow:none}
.sheet.dark-bg .chipbtn{color:var(--ink)}
.sheet.dark-bg .chipbtn.on{color:#fff}
.sheet.dark-bg .small,.sheet.dark-bg p.small{color:#f0dfba}
.sheet.dark-bg h3 .small{color:var(--gold-hi)}
.chobo{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.chobo .btn{padding:4px;min-height:0}
.chobo .die{width:100%;height:auto;aspect-ratio:1;padding:5px}
html:not(.lang-ja) .side-btns .pill{font-size:10.5px;padding:4px 7px;gap:3px}
.langrow{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700}
.langrow select{font:inherit;font-size:15px;padding:6px 10px;border-radius:8px;border:2px solid #b8894a;background:#fffaf0;color:var(--ink)}
html:not(.lang-ja) .logo{font-size:clamp(17px,5.4vw,24px);white-space:normal;line-height:1.05}
html:not(.lang-ja) .logo .l2{font-size:clamp(19px,6vw,27px)}
html:not(.lang-ja) .logo{flex:1;min-width:0}
html:not(.lang-ja) .logo .l2{margin-left:.25em}
html:not(.lang-ja) .goal{flex:0 1 auto;min-width:0;max-width:38%;padding:2px 6px}
html:not(.lang-ja) .goal small{font-size:8px;letter-spacing:0}
html:not(.lang-ja) .goal b{font-size:11px;letter-spacing:0;display:block;line-height:1.2}
html:not(.lang-ja) .daybox{font-size:11px;padding:4px 6px;gap:3px;min-width:0;overflow:hidden}
html:not(.lang-ja) .daybox small{display:none}
html:not(.lang-ja) .repbox small{display:none}
html:not(.lang-ja) .chapter{font-size:12px}
.hud,.hud-row1,.hud-row2,.hud-row3{min-width:0;max-width:100%}
html:not(.lang-ja) .btn{font-size:clamp(12px,3.5vw,14px)}
html:not(.lang-ja) .btn small{font-size:9.5px}
html:not(.lang-ja) .btn-main{letter-spacing:.04em;font-size:clamp(18px,5.4vw,24px)}
html:not(.lang-ja) .tab{font-size:10.5px}
html:not(.lang-ja) .card .nm{font-size:clamp(12.5px,3.8vw,16px)}
html:not(.lang-ja) .chip span{font-size:8.5px}
html.lang-ko,html.lang-ko body{--display:"Noto Serif KR","Shippori Mincho B1",serif;--ui:"Noto Sans KR","Zen Kaku Gothic New",system-ui,sans-serif}
html.lang-zh-CN{--display:"Noto Serif SC","Shippori Mincho B1",serif;--ui:"Noto Sans SC","Zen Kaku Gothic New",system-ui,sans-serif}
html.lang-zh-TW{--display:"Noto Serif TC","Shippori Mincho B1",serif;--ui:"Noto Sans TC","Zen Kaku Gothic New",system-ui,sans-serif}
.guide{position:relative;z-index:3;display:flex;align-items:center;gap:8px;background:linear-gradient(#1d2547,#34407a);color:#fff;border:2px solid var(--gold-hi);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;line-height:1.5;box-shadow:0 0 14px rgba(255,224,138,.5);animation:pulse 2s ease-in-out infinite}

function autoDay(){

    let best=null;
    (R.ms||[R.m]).forEach(m=>{ if(!m||!MT[m.t]||m.refuse) return; const offV=ITEM[m.offer.id].v*(m.known?0.1:1);
      R.items.forEach(x=>{ const v=val(x); if(offV<=v*1.05) return; const p=calc(m,x).p; if(p<0.5) return; const sc=p*Math.log(offV/v); if(!best||sc>best.sc) best={m,x,p,sc}; }); });
    if(best){ const {m,x}=best; const c=calc(m,x); const win=rnd()<c.p;
      if(win){ R.items=R.items.filter(y=>y.u!==x.u); const got={u:uid(),id:m.offer.id,fake:m.offer.fake}; R.items.push(got); R.sel=got.u; addDex(got.id); S.rec.trades=(S.rec.trades||0)+1; R.rep=Math.min(100,(R.rep??60)+2);
        log.push("⭕ "+ITEM[x.id].n+" → "+ITEM[got.id].n+(got.fake?T("（偽物！）"):"")); if(got.id==="universe"){ S.rec.cleared=true; break; } }
      else { const t=MT[m.t]; let st=""; if(t.steal&&rnd()<t.steal){ R.items=R.items.filter(y=>y.u!==x.u); st=T("（持っていかれた）"); } log.push("❌ "+ITEM[x.id].n+" ✕ "+ITEM[m.offer.id].n+st); }
      fixSel(); }
    else log.push(T("… 良い取引がなく見送った"));

    advanceQuiet();
  }
  track(); save(); render();
  modal(`<h3>${T("⏩ おまかせの結果")}</h3><div class="autolog">${log.map(l=>`<div>${esc(l)}</div>`).join("")||T("なし")}</div><p class="small center">${T("成功率50%以上の、得になる交換だけをした。交渉はしていない。")}</p><div class="btns"><button class="btn gold" type="button" data-act="close">${T("とじる")}</button></div>`,{center:true});

  R.omi=k; const o=OMIKUJI[k]; sfx(k<=1?"fanfare":k>=5?"lose":"coin");
  modal(`<div class="omikuji"><div class="omi-paper"><small>${T("御神籤")}</small><b>${o[0]}</b><span>${esc(o[3])}</span></div></div>

let SN=null;
const BUYERS=[[T("古道具屋の主人"),"m_stingy"],[T("両替商の番頭"),"m_greedy"],[T("物好きな隠居"),"m_collector"],[T("町娘"),"m_lady"]];
function openSell(x){

}
function pAccept(q){ const omi=S.run.omi!=null?OMIKUJI[S.run.omi][2]:1; return Math.min(0.95,Math.exp(-2.2*(q-1))*negoM()*omi); }
function showSell(){

  const can=SN.tries>0;
  modal(`<div class="sellhead">${IMGS.has(SN.img)?`<img src="img/${SN.img}.webp" alt="">`:""}<div><b>${esc(SN.buyer)}</b><span class="small">${T("売値の交渉")}</span></div></div>

    <button class="btn-main" type="button" data-act="sellok">${T("この値で売る")}</button>
    <div class="grid4">
      <button class="btn" type="button" data-act="ask" data-k="1.2" ${can?"":"disabled"}><span class="emo">🙏</span><span>${T("少し上げて")}<small>${T("+20%・通る確率 {0}%",Math.round(pAccept(SN.ask*1.2/SN.base)*100))}</small></span></button>
      <button class="btn" type="button" data-act="ask" data-k="1.6" ${can?"":"disabled"}><span class="emo">💥</span><span>${T("ふっかける")}<small>${T("+60%・通る確率 {0}%",Math.round(pAccept(SN.ask*1.6/SN.base)*100))}</small></span></button>
    </div>
    <p class="center small">${T("断られると相手の言い値が下がる。あと{0}回まで粘れる。",SN.tries)}</p>
    <div class="btns"><button class="btn" type="button" data-act="close">${T("売るのをやめる")}</button></div>`,{center:true});
}
function askMore(f){
  if(!SN||SN.tries<=0) return; const q=SN.ask*f/SN.base;
  if(rnd()<pAccept(q)){ SN.ask*=f; SN.line=pick([T("……仕方ない、その値で買おう。"),T("まいったな、それでいいよ。"),T("ふむ、その値でも欲しい品だ。")]); sfx("coin"); }
  else { SN.tries--; SN.base*=0.9; SN.ask=Math.min(SN.ask,SN.base); SN.line=T("{0}　{1}なら買うが？",pick([T("そんな値じゃ買えないね。"),T("冗談はよしてくれ。"),T("それなら他を当たってくれ。")]),yen(SN.ask)); sfx("lose"); shake(); }
  showSell();
}
function sellNow(){
  const R=S.run, x=R.items.find(y=>y.u===SN.u); if(!x) return closeModal();
  const price=SN.ask; R.items=R.items.filter(y=>y.u!==x.u); S.money+=price; fixSel(); SN=null;
  closeModal(); toast(T("{0}を {1} で売った",def(x).n,yen(price)),"good");
  sfx("coin"); coinFx(); track(); save(); render(); checkBroke();
}
function haggle(i){
  const s=S.run.stock[i]; if(!s||s.sold||s.hag) return; s.hag=true;
  if(rnd()<0.55*negoM()*(S.run.omi!=null?OMIKUJI[S.run.omi][2]:1)){ s.disc=0.75; toast(T("🙌 「まけとくよ！」 2割5分引きになった"),"good"); sfx("coin"); }
  else { s.disc=1.1; toast(T("😤 「冷やかしなら帰っとくれ」 1割高くなった"),"bad"); sfx("lose"); }
  save(); render();
}

function cutin(title,sub,img,bg){

function typeBubble(){
  const b=document.querySelector(".bubble"); if(!b||typedKey===mKey) return; typedKey=mKey;
  const full=b.textContent; b.textContent=""; let i=0;
  const iv=setInterval(()=>{ if(!b.isConnected){ clearInterval(iv); return; } i+=2; b.textContent=full.slice(0,i); if(i>=full.length) clearInterval(iv); },28);

let shownMoney=null, tw=null;
function tweenMoney(to){
  const el=$("#hMoney"); if(shownMoney===null||!isFinite(shownMoney)){ shownMoney=to; el.textContent=yen(to); return; }
  const from=shownMoney; if(from===to){ el.textContent=yen(to); return; }
  cancelAnimationFrame(tw); const t0=performance.now(), L=v=>Math.log10(Math.max(v,0)+1);
  const step=t=>{ const k=Math.min(1,(t-t0)/600), e=1-Math.pow(1-k,3); const v=Math.pow(10,L(from)+(L(to)-L(from))*e)-1; el.textContent=yen(Math.max(0,v)); el.classList.toggle("up",to>from); if(k<1) tw=requestAnimationFrame(step); else { shownMoney=to; el.textContent=yen(to); el.classList.remove("up"); } };
  tw=requestAnimationFrame(step);
}

function doMove(k){
  const m=cur(); if(m.pat<=0) return; m.pat--;
  const t=MT[m.t]||{weak:"stay",strong:"push"}; let line, dm=0;
  const nk=PK("nego")?1.5:1;
  if(k===t.weak){ m.neg+=0.3*nk; line=m.t==="mystery"?T("……しつこいな。だが嫌いではない。"):pick(GOOD); dm=1; }
  else if(k===t.strong){ m.neg-=0.15/nk; line=m.t==="mystery"?T("……ほう。"):pick(BAD); dm=-1; }
  else { m.neg+=0.05+rnd()*0.07; line=m.t==="mystery"?"……":pick(MEH); }
  if(k==="flatter"&&dm>=0) dm+=1;
  if(m.t!=="mystery") m.mood=clamp(m.mood+dm,0,4);
  m.line=line; save(); render(); showNego(line);
}

  closeModal(); STORY={i:0,done,typing:null};
  let el=$("#story"); if(!el){ el=document.createElement("div"); el.id="story"; el.className="story"; document.body.appendChild(el);
    el.innerHTML=`<div class="st-bg"></div><div class="st-fx"></div><img class="st-chr" alt=""><div class="st-item"></div><div class="st-title">${T("わらから")}<span>${T("宇宙へ")}</span></div>
      <div class="st-box"><b class="st-name"></b><p class="st-text"></p><span class="st-next">▼</span></div><button class="st-skip" type="button">${T("スキップ ▶▶")}</button>`;
    el.addEventListener("click",e=>{ auInit(); if(e.target.closest(".st-skip")){ endStory(); return; } stepStory(); }); }
  el.hidden=false; bgmSync(); drawScene();
}
function drawScene(){
  const el=$("#story"), sc=PROLOGUE[STORY.i];
  const bg=el.querySelector(".st-bg"); bg.style.backgroundImage=IMGS.has(sc.bg)?`url(img/${sc.bg}.webp)`:""; bg.classList.remove("kb"); void bg.offsetWidth; bg.classList.add("kb");
  el.querySelector(".st-fx").className="st-fx "+(sc.fx||"");
  const ch=el.querySelector(".st-chr"); if(sc.chr&&IMGS.has(sc.chr)){ ch.src=`img/${sc.chr}.webp`; ch.hidden=false; ch.classList.remove("in"); void ch.offsetWidth; ch.classList.add("in"); } else ch.hidden=true;
  const it=el.querySelector(".st-item"); it.innerHTML=sc.item?ic(sc.item):""; it.hidden=!sc.item;
  el.querySelector(".st-title").hidden=!sc.title;
  const nm=el.querySelector(".st-name"); nm.textContent=sc.name||""; nm.hidden=!sc.name;
  const tx=el.querySelector(".st-text"); tx.textContent=""; let k=0; clearInterval(STORY.typing);
  STORY.typing=setInterval(()=>{ k++; tx.textContent=sc.text.slice(0,k); if(k>=sc.text.length){ clearInterval(STORY.typing); STORY.typing=null; } },45);
  if(sc.title) sfx("fanfare"); else if(sc.chr==="m_mystery") sfx("cosmic"); else if(sc.item) sfx("day");
}
function stepStory(){
  const tx=$("#story .st-text"), sc=PROLOGUE[STORY.i];
  if(STORY.typing){ clearInterval(STORY.typing); STORY.typing=null; tx.textContent=sc.text; return; }
  sfx("click"); STORY.i++; if(STORY.i>=PROLOGUE.length) endStory(); else drawScene();
}
function endStory(){ const el=$("#story"); if(el) el.hidden=true; clearInterval(STORY&&STORY.typing); const d=STORY&&STORY.done; STORY=null; bgmSync(); if(d) d(); }
let RP=0, rulesDone=null;
function showRules(done){ RP=0; rulesDone=done||null; drawRules(); }
function drawRules(){
  const r=RULES[RP], last=RP===RULES.length-1;
  modal(`<div class="rules"><div class="rl-img">${IMGS.has(r.img)?`<img src="img/${r.img}.webp" alt="">`:""}</div>
    <small class="rl-step">${T("遊び方 {0} / {1}",RP+1,RULES.length)}</small><h3>${esc(r.t)}</h3><p>${r.b}</p>
    <div class="rl-dots">${RULES.map((_,i)=>`<i class="${i===RP?"on":""}"></i>`).join("")}</div></div>
    <div class="btns two"><button class="btn" type="button" data-act="rprev" ${RP?"":"disabled"}>${T("もどる")}</button>
    <button class="btn gold" type="button" data-act="rnext">${last?T("旅に出る！"):T("つぎへ")}</button></div>
    ${last?"":`<button class="linkbtn" type="button" data-act="rskip">${T("説明をとばす")}</button>`}`,{center:true,lock:true});
}
function rulesFinish(){ closeModal(); const d=rulesDone; rulesDone=null; render(); if(d) d(); }
function startOpening(){ S.intro=true; S.storySeen=true; S.tut=0; save(); showStory(()=>showRules(()=>{ render(); })); }

const AU={ctx:null,master:null,bgm:null,se:null,song:-1,timer:null,step:0,next:0,nb:null,mel:{}};
const SONGS=[
 {tempo:100,root:62,sc:[0,2,5,7,9],lead:"koto",perc:"taiko",bass:"koto",seed:3},
 {tempo:92,root:64,sc:[0,1,5,7,8],lead:"shami",perc:"taiko",bass:"koto",seed:7},
 {tempo:84,root:72,sc:[0,2,4,7,9],lead:"bell",perc:"soft",bass:"pluck",seed:11},
 {tempo:112,root:69,sc:[0,2,4,7,9],lead:"synth",perc:"beat",bass:"synthbass",pad:1,seed:5},
 {tempo:72,root:62,sc:[0,2,5,7,9],lead:"bell",perc:null,bass:"pad",pad:1,seed:13},
 {tempo:60,root:60,sc:[0,1,5,7,8],lead:"flute",perc:null,bass:"pad",pad:1,seed:17},
 {tempo:132,root:64,sc:[0,1,5,7,8],lead:"shami",perc:"fast",bass:"koto",seed:21},
 {tempo:76,root:67,sc:[0,2,5,7,9],lead:"flute",perc:"soft",bass:"koto",seed:9}
];
const mf=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
  if(AU.ctx) { if(AU.ctx.state==="suspended") AU.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{ AU.ctx=new C(); }catch(e){ return; }
  const c=AU.ctx; AU.master=c.createGain(); AU.master.gain.value=0.8; AU.master.connect(c.destination);
  AU.bgm=c.createGain(); AU.bgm.gain.value=0.3; AU.se=c.createGain(); AU.se.gain.value=0.55;
  const rev=c.createConvolver(), len=c.sampleRate*1.8, ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  rev.buffer=ir; const wet=c.createGain(); wet.gain.value=0.28; rev.connect(wet); wet.connect(AU.master);
  AU.bgm.connect(AU.master); AU.bgm.connect(rev); AU.se.connect(AU.master); AU.se.connect(rev);
  AU.nb=c.createBuffer(1,c.sampleRate,c.sampleRate); const nd=AU.nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  document.addEventListener("visibilitychange",()=>{ if(!AU.ctx) return; if(document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });
  bgmSync();
}
function env(g,t,a,peak,d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function osc(type,f,t,dur,vol,dest,bend){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(bend) o.frequency.exponentialRampToValueAtTime(f*bend,t+dur); o.connect(g); g.connect(dest); env(g,t,0.005,vol,dur); o.start(t); o.stop(t+dur+0.05); }
function noise(t,dur,vol,dest,freq,q,type){ const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(); s.buffer=AU.nb; f.type=type||"bandpass"; f.frequency.value=freq||1000; f.Q.value=q||1; s.connect(f); f.connect(g); g.connect(dest); env(g,t,0.002,vol,dur); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05); }
function tone(name,m,t,dur,vol,dest){
  const f=mf(m), c=AU.ctx;
  if(name==="koto"){ osc("triangle",f,t,Math.max(dur,0.7),vol,dest); osc("sine",f*2,t,0.35,vol*0.3,dest); noise(t,0.025,vol*0.35,dest,f*3,3); }
  else if(name==="shami"){ const o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(f*1.012,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05); fl.type="bandpass"; fl.frequency.value=f*2.5; fl.Q.value=2; o.connect(fl); fl.connect(g); g.connect(dest); env(g,t,0.003,vol*1.5,0.3); o.start(t); o.stop(t+0.4); noise(t,0.02,vol*0.5,dest,3200,2); }
  else if(name==="bell"){ osc("sine",f,t,1.3,vol*0.8,dest); osc("sine",f*2.76,t,0.55,vol*0.22,dest); osc("sine",f*5.4,t,0.22,vol*0.1,dest); }
  else if(name==="flute"){ const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain(); o.type="sine"; o.frequency.value=f; l.frequency.value=5; lg.gain.value=f*0.012; l.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(dest); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*0.8,t+0.08); g.gain.setValueAtTime(vol*0.8,t+Math.max(0.1,dur-0.1)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.15); o.start(t); l.start(t); o.stop(t+dur+0.2); l.stop(t+dur+0.2); noise(t,dur*0.5,vol*0.06,dest,f*2,1.5); }
  else if(name==="synth"){ osc("square",f,t,0.22,vol*0.3,dest); osc("triangle",f*2,t,0.18,vol*0.25,dest); }
  else if(name==="pluck"){ osc("triangle",f,t,0.4,vol,dest); }
  else if(name==="synthbass"){ osc("triangle",f,t,0.28,vol*1.2,dest); }
  else if(name==="pad"){ [1,1.004,0.996].forEach(k=>{ const o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain(); o.type="sawtooth"; o.frequency.value=f*k; fl.type="lowpass"; fl.frequency.value=900; o.connect(fl); fl.connect(g); g.connect(dest); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*0.2,t+0.8); g.gain.setValueAtTime(vol*0.2,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+1.2); o.start(t); o.stop(t+dur+1.3); }); }
}
function taiko(t,vol,dest){ osc("sine",140,t,0.35,vol,dest,0.35); noise(t,0.06,vol*0.5,dest,300,0.7,"lowpass"); }
function clack(t,vol,dest){ noise(t,0.04,vol,dest,2600,6); }
function hat(t,vol,dest){ noise(t,0.03,vol,dest,8000,1,"highpass"); }
function melody(k){
  if(AU.mel[k]) return AU.mel[k];
  let sd=SONGS[k].seed*9301+49297; const r=()=>{ sd=(sd*9301+49297)%233280; return sd/233280; };
  const mel=[]; let d=2;
  for(let i=0;i<64;i++){
    const strong=i%2===0, end=i%32>=28;
    if(i%32===30||i%32===31){ mel.push(i%32===30?0:null); continue; }
    if(r()<(strong?0.78:0.32)){ d=clamp(d+Math.round((r()*4-2)),-2,8); if(end) d=Math.round(d/2); mel.push(d); } else mel.push(null);
  }
  return AU.mel[k]=mel;
}
function deg(sg,d){ const n=sg.sc.length, o=Math.floor(d/n), i=((d%n)+n)%n; return sg.root+12*o+sg.sc[i]; }
function playStep(k,i,t,sd){
  const sg=SONGS[k], dst=AU.bgm, mel=melody(k), m=mel[i];
  if(m!=null){ let len=1; while(len<4&&mel[(i+len)%64]==null) len++; tone(sg.lead,deg(sg,m),t,sd*len*0.9,sg.lead==="flute"?0.32:0.38,dst); }
  if(i%8===0) tone(sg.bass==="pad"?"koto":sg.bass,sg.root-12,t,sd*3,0.3,dst);
  if(i%8===4) tone(sg.bass==="pad"?"koto":sg.bass,sg.root-12+sg.sc[3],t,sd*3,0.24,dst);
  if(sg.pad&&i%16===0) [0,7,12+sg.sc[1]].forEach(o=>tone("pad",sg.root-12+o,t,sd*14,0.5,dst));
  const p=sg.perc;
  if(p==="taiko"){ if(i%16===0) taiko(t,0.55,dst); if(i%16===6||i%16===10) taiko(t,0.3,dst); if(i%4===2) clack(t,0.12,dst); }
  else if(p==="fast"){ if(i%4===0) taiko(t,0.5,dst); if(i%4===3) taiko(t,0.25,dst); if(i%2===1) clack(t,0.1,dst); }
  else if(p==="beat"){ if(i%4===0) taiko(t,0.45,dst); if(i%2===1) hat(t,0.08,dst); if(i%8===4) clack(t,0.18,dst); }
  else if(p==="soft"){ if(i%8===4) clack(t,0.1,dst); }
}
function songFor(){ if(STORY) return 7; const R=S&&S.run; if(!R) return 0; if(TAB==="trade"&&R.m&&R.view!=="mys"){ if(R.m.t==="dice") return 6; if(R.m.t==="miko") return 7; } return reg().music; }
function bgmSync(){
  if(!AU.ctx) return;
  const want=S.audio.bgm?songFor():-1; if(want===AU.song) return;
  AU.song=want; AU.step=0; AU.next=AU.ctx.currentTime+0.15;
  if(!AU.timer) AU.timer=setInterval(()=>{ if(AU.song<0||!AU.ctx||AU.ctx.state!=="running") return; const sd=60/SONGS[AU.song].tempo/2; while(AU.next<AU.ctx.currentTime+0.25){ playStep(AU.song,AU.step,AU.next,sd); AU.step=(AU.step+1)%64; AU.next+=sd; } },40);
}
function sfx(n){
  if(!AU.ctx||!S||!S.audio.se) return; const t=AU.ctx.currentTime+0.01, d=AU.se;
  if(n==="click") clack(t,0.18,d);
  else if(n==="coin"){ osc("square",1320,t,0.07,0.1,d); osc("square",1760,t+0.07,0.16,0.1,d); }
  else if(n==="win") [72,74,77,79].forEach((m,i)=>tone("koto",m,t+i*0.08,0.4,0.4,d));
  else if(n==="fanfare"){ [67,69,72,74,76,79,84].forEach((m,i)=>tone("bell",m,t+i*0.07,0.5,0.35,d)); taiko(t,0.6,d); taiko(t+0.42,0.7,d); }
  else if(n==="lose"){ tone("shami",64,t,0.3,0.4,d); tone("shami",61,t+0.18,0.5,0.4,d); taiko(t+0.1,0.5,d); }
  else if(n==="dice"){ for(let i=0;i<12;i++) clack(t+i*0.09+Math.random()*0.03,0.28,d); }
  else if(n==="break"){ noise(t,0.35,0.6,d,1200,0.5,"lowpass"); taiko(t,0.6,d); noise(t+0.05,0.2,0.3,d,4000,1); }
  else if(n==="tension"){ for(let i=0;i<4;i++) taiko(t+i*0.24,0.3+i*0.08,d); }
  else if(n==="drum"){ for(let i=0;i<18;i++) taiko(t+i*0.11,0.15+i*0.03,d); }
  else if(n==="day"){ tone("bell",79,t,1,0.3,d); tone("bell",74,t+0.15,1,0.25,d); }
  else if(n==="travel") [74,76,79,81,86].forEach((m,i)=>tone("flute",m,t+i*0.12,0.25,0.3,d));
  else if(n==="stamp"){ taiko(t,0.4,d); clack(t,0.4,d); }
  else if(n==="heart"){ for(let i=0;i<4;i++){ taiko(t+i*0.7,0.35,d); taiko(t+i*0.7+0.18,0.22,d); } }
  else if(n==="thunder"){ noise(t,1.6,0.7,d,180,0.6,"lowpass"); noise(t,0.25,0.5,d,3000,0.8); taiko(t,0.7,d); }
  else if(n==="cosmic"){ [48,55,60,67,72].forEach((m,i)=>tone("pad",m,t+i*0.05,1.6,0.5,d)); tone("bell",96,t+0.3,1.5,0.25,d); }
}

/* ---------- input ---------- */
document.addEventListener("pointerdown",()=>auInit(),{passive:true});
document.addEventListener("change",ev=>{ if(ev.target&&ev.target.id==="langSel"){ save(); setLang(ev.target.value); } });
document.addEventListener("click",ev=>{
  auInit();
  const b=ev.target.closest("[data-act]");
  if(!b){ if(ev.target.id==="modal"&&!modalLock) closeModal(); return; }
  if(b.disabled) return;
  const a=b.dataset.act, R=S.run;
  if(!["trade","bet","sellok","omikuji"].includes(a)) sfx("click");
  if(a!=="sell"&&a!=="break"&&a!=="wipe"&&confirmKey){ confirmKey=null; if(TAB==="trade") render(); }

    case "tab": TAB=b.dataset.k; confirmKey=null; render(); $("#main").scrollTop=0; break;
    case "close": closeModal(); render(); break;
    case "trade": doTrade(false); break;
    case "after-win": case "after-lose": afterTrade(); break;
    case "ad-retry": { const m=cur(); m.retry=true; fakeAd(()=>doTrade(true),"retry",()=>afterTrade()); break; }
    case "next": if(R.view==="mys"){R.view="m";} advance(); break;
    case "nego": tutAt(2); showNego(); break;
    case "move": doMove(b.dataset.k); break;
    case "addm": { const m=cur(); const step=Math.max(1,Math.ceil(ITEM[m.offer.id].v*0.1)); if(S.money>=m.add+step){ m.add+=step; render(); showNego(T("おっ、話がわかるじゃないか")); } break; }
    case "detail": showDetail(); break;
    case "pick": if(R.items.length>1) showPicker(); break;
    case "sel": R.sel=+b.dataset.u; closeModal(); save(); render(); break;
    case "sell": { const x=selInst(); if(!x) break; confirmKey=null; openSell(x); break; }
    case "break": { const x=selInst(); if(!x) break; if(val(x)>=100&&confirmKey!=="break"){ confirmKey="break"; render(); break; } confirmKey=null; doBreak(x); break; }
    case "mys": R.view="mys"; render(); break;
    case "unmys": R.view="m"; render(); break;
    case "abu": { tutAt(0); const w=R.items.find(y=>y.id==="wara"); if(w){ w.id="abu"; addDex("abu"); R.abu=false; R.sel=w.u; if(R.m) setLine(R.m,w); toast(T("🪰 アブを捕まえて、わらの先に結んだ！ブンブン飛び回って面白い"),"good"); save(); render(); } break; }
    case "use": R.sel=+b.dataset.u; TAB="trade"; R.view="m"; render(); break;
    case "bsell": { const x=R.items.find(y=>y.u===+b.dataset.u); if(x) openSell(x); break; }
    case "sellok": sellNow(); break;
    case "ask": askMore(+b.dataset.k); break;
    case "haggle": haggle(+b.dataset.i); break;
    case "askm": { const m=cur(); const step=Math.max(1,Math.ceil(ITEM[m.offer.id].v*0.1)); m.add-=step; render(); showNego(pick([T("なに、こっちが金を出せと？"),T("ずいぶん欲張るじゃないか…"),T("ふん、それなら話は変わるぞ")])); break; }
    case "stake": stake=b.dataset.k; render(); break;

    case "leave": leaveVisitor(); break;
    case "omikuji": drawOmikuji(); break;
    case "musubu": { R.omi=4; closeModal(); toast(T("🎋 おみくじを木に結んだ。厄が落ちて末吉になった"),"good"); save(); render(); break; }
    case "omidone": closeModal(); leaveVisitor(); break;
    case "qaccept": { const q=R.m.quest; R.quests.push(q); const have=R.items.find(y=>y.id===q.id); if(have){ giveQuest(have.u); } else { toast(T("📜 依頼を引き受けた：{0}（{1}日目まで）",ITEM[q.id].n,q.due),"good"); sfx("stamp"); } leaveVisitor(); break; }

    case "travel": travel(+b.dataset.k); break;
    case "aud": { const k=b.dataset.k; S.audio[k]=S.audio[k]?0:1; if(k==="bgm") bgmSync(); save(); showSettings(); break; }
    case "bbreak": { const x=R.items.find(y=>y.u===+b.dataset.u); if(x) doBreak(x); break; }
    case "psell": sellParts(b.dataset.p); break;
    case "craft": craft(+b.dataset.i); break;
    case "buy": buy(+b.dataset.i); break;
    case "up": buyUp(b.dataset.id,b.dataset.n==="max"?"max":+b.dataset.n); break;
    case "shopup": buyShop(); break;
    case "ad-shop": fakeAd(()=>{ const g=income()*(EV[R.event].income||1); S.money+=g; R.adShop=true; toast(T("📺 店の売上 +{0}",yen(g)),"good"); coinFx(); save(); render(); },"shop"); break;
    case "end-ad": fakeAd(()=>finishRun(2),"end",()=>finishRun(1)); break;
    case "buyadfree": try{ window.Native.buyAdFree(); }catch(e){} break;
    case "restore": try{ window.Native.restore(); toast(T("購入を確認している…")); }catch(e){} break;
    case "privacy": try{ window.Native.privacyOptions(); }catch(e){} break;
    case "end-ok": finishRun(1); break;
    case "settings": confirmKey=null; showSettings(); break;
    case "quit": closeModal(); endRun("quit"); break;
    case "wipe": if(confirmKey!=="wipe"){ confirmKey="wipe"; showSettings(); break; } confirmKey=null; try{localStorage.removeItem(SAVE_KEY);}catch(e){} S=fresh(); newRun(); closeModal(); TAB="trade"; save(); render(); startOpening(); break;
  }
});

/* ---------- Android app hooks (back button, pause/resume) ---------- */
let backAt=0;
window.__back=()=>{ try{
  if(STORY){ endStory(); return true; }
  if(!$("#modal").hidden){ if(!modalLock){ closeModal(); render(); } return true; }
  if(TAB!=="trade"){ TAB="trade"; render(); return true; }
  if(S.run&&S.run.view==="mys"){ S.run.view="m"; render(); return true; }
  const now=Date.now(); if(now-backAt<2000){ save(); return false; }
  backAt=now; toast(T("もう一度押すと終了します")); return true;
}catch(e){ return false; } };
window.__pause=()=>{ try{ save(); if(AU.ctx) AU.ctx.suspend(); }catch(e){} };
window.__resume=()=>{ try{ if(AU.ctx) AU.ctx.resume(); }catch(e){} };

/* ---------- boot ---------- */
const STATIC_KEYS=[T("わらから"),T("宇宙へ"),T("最終目標"),T("宇宙を買う"),T("資産総額"),T("所持金"),T("名声"),T("商人たちの評判"),T("今日の天気"),T("設定と記録"),T("わらから宇宙へ")];
function localizeStatic(){
  document.querySelectorAll(".hud span,.hud small,.hud b,.hud h1 span").forEach(el=>{ if(el.children.length===0&&/[\u3040-\u30ff\u4e00-\u9fff]/.test(el.textContent)) el.textContent=T(el.textContent); });
  document.querySelectorAll("[title],[aria-label]").forEach(el=>{ ["title","aria-label"].forEach(a=>{ const v=el.getAttribute(a); if(v&&/[\u3040-\u30ff\u4e00-\u9fff]/.test(v)) el.setAttribute(a,T(v)); }); });
  document.title=T("わらから宇宙へ"); document.documentElement.lang=LANG; document.documentElement.classList.add("lang-"+LANG);
}
function relocalize(){
  if(!S||!S.run||S.lang===LANG) return;
  const rev=new Map(), I=window.I18N||{}, F=["name","line","rumor","text","msg","desc","title"];
  for(const d of Object.values(I)) for(const k in d){ if(/{d+}|{o}|{like}/.test(k)) continue; rev.set(k,k); const v=d[k]; if(v&&!rev.has(v)) rev.set(v,k); }
  const walk=(o,dep)=>{ if(!o||typeof o!=="object"||dep>5) return; for(const k in o){ const v=o[k]; if(typeof v==="string"){ if(F.includes(k)&&rev.has(v)) o[k]=T(rev.get(v)); } else walk(v,dep+1); } };
  walk(S.run,0);
  const x=selInst(); [S.run.m,...(S.run.ms||[])].forEach(m=>{ if(m&&MT[m.t]&&!m.refuse&&x){ try{ setLine(m,x); }catch(e){} } });
  S.lang=LANG;
}
function start(data){
  localizeStatic();
  const had=load(data&&data.save);
  if(!S.run) newRun();
  relocalize();
  const away=had?(Date.now()-(S.lastSeen||Date.now()))/60000:0;
  render();
  if(!S.intro){ startOpening(); }
  else if(!S.storySeen){ S.storySeen=true; save(); showStory(()=>showRules(null)); }
  else if(S.run.over){ S.run.over=false; endRun("days"); }
  else if(S.run.perkOpts&&!S.run.perk) showPerks(T("{0}回目の旅",(S.rec.runs+1)));
  else if(income()>0 && away>=2){
    const days=Math.min(away/20,9), g=income()*days;
    if(g>=1){ S.money+=g; save(); render(); modal(`<h3>${T("おかえり！")}</h3><div class="center emo" style="font-size:72px">${art(SHOPS[S.shop].img,SHOPS[S.shop].i)}</div><p class="center">${T("留守のあいだに {0} が",esc(SHOPS[S.shop].n))}<br><b style="font-size:20px;color:#1a6b2a">${yen(g)}</b> ${T("稼いでいた。")}</p><div class="btns"><button class="btn gold" type="button" data-act="close">${T("受け取る")}</button></div>`,{center:true}); }
  }
  save();
}
try{ window.claude?.hot?.snapshot?.(()=>({save:JSON.stringify(S)})); }catch(e){}
const H=window.claude&&window.claude.hot;
if(H&&H.ready) H.ready(start); else start((H&&H.data)||{});
})();
</script>
